<style>
.eng-wrap{max-width:1080px;margin:0 auto;padding:26px 24px 80px}
.eng-kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.eng-wrap h1{font-size:26px;line-height:1.35;margin:8px 0 6px;font-weight:700}
.eng-meta{color:var(--muted);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.eng-chip{border:1px solid var(--border);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--muted)}
.eng-chip.q{border-color:#c98a2e;color:#a86b12}

/* 播放条 */
.eng-player{margin:18px 0 6px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.eng-player button{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.eng-player button:hover{border-color:var(--accent);color:var(--accent)}
.eng-time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);min-width:96px}
.eng-track{flex:1;min-width:180px;height:6px;border-radius:99px;background:var(--border);overflow:hidden;cursor:pointer}
.eng-track i{display:block;height:100%;width:0;background:var(--accent)}

/* 标签页 */
.eng-tabs{display:flex;gap:6px;margin:22px 0 16px;border-bottom:1px solid var(--border);padding-bottom:0}
.eng-tabs button{border:0;background:none;font-family:inherit;font-size:14px;color:var(--muted);padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.eng-tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.eng-tabs small{font-size:11px;color:var(--muted);margin-left:4px}

/* 课文 */
.eng-p{line-height:1.95;margin:0 0 16px;font-size:16px}
.sg{cursor:pointer;border-radius:3px;transition:background .12s}
.sg:hover{background:var(--okbg)}
.sg.on{background:var(--okbg);box-shadow:inset 0 -2px 0 var(--accent)}
.eng-hint{font-size:12px;color:var(--muted);margin:-6px 0 18px}

/* 词表 */
.eng-tools{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.eng-tools input[type=text]{flex:1;min-width:160px;border:1px solid var(--border);background:var(--bg);color:var(--text);
border-radius:9px;padding:7px 11px;font-size:13px;font-family:inherit}
.eng-tools label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}
.eng-group{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.eng-tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.eng-t{width:100%;min-width:520px;border-collapse:collapse;font-size:14px}
table.eng-t th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding:6px 8px}
table.eng-t td{border-bottom:1px solid var(--border);padding:8px;vertical-align:top}
table.eng-t tr:hover td{background:var(--surface)}
.eng-w{font-weight:600;font-size:15px}
.eng-ipa{font-family:"Times New Roman",Georgia,serif;color:var(--accent);font-size:13.5px}
.eng-pos{color:var(--muted);font-size:12px;font-style:italic}
.eng-cn{color:var(--text);font-size:13.5px}
.eng-play{border:1px solid var(--border);background:var(--bg);color:var(--accent);border-radius:7px;width:30px;height:26px;
cursor:pointer;font-size:11px;line-height:1}
.eng-play:hover{background:var(--okbg)}
.eng-play.playing{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.eng-out{white-space:nowrap;color:var(--muted);font-size:12px}
.badge-q{display:inline-block;margin-left:6px;font-size:10.5px;color:#a86b12;border:1px solid #c98a2e;border-radius:6px;padding:0 5px;vertical-align:2px}

/* 课本分级标识 */
.badge-mk{display:inline-block;margin-left:5px;font-size:10.5px;border:1px solid var(--border);border-radius:6px;padding:0 5px;vertical-align:2px;line-height:1.5}
.badge-mk.m4{color:var(--accent);border-color:var(--accent)}
.badge-mk.m6{color:#a855f7;border-color:#a855f7}
.badge-mk.m0{color:var(--muted);border-style:dashed;border-color:var(--muted)}
.eng-tools select{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;padding:7px 9px;font-size:13px;font-family:inherit}
.eng-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:0 0 14px}
.eng-legend span b{font-weight:600}

/* 总览 */
.eng-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.eng-card{border:1px solid var(--border);border-radius:12px;padding:16px 16px 14px;background:var(--surface);cursor:pointer;transition:border-color .15s,transform .15s}
.eng-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.eng-card .u{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.eng-card h3{margin:6px 0 8px;font-size:16.5px;line-height:1.45}
.eng-card .m{font-size:12px;color:var(--muted);display:flex;gap:12px}
.eng-note{margin-top:28px;border-left:3px solid var(--accent);background:var(--surface);padding:12px 16px;border-radius:0 8px 8px 0;font-size:13px;color:var(--muted);line-height:1.85}
.eng-note b{color:var(--text)}
@media (max-width:640px){
  .eng-wrap{padding:18px 14px 60px}
  .eng-wrap h1{font-size:21px}
  /* 手机上把词表改成「一行一个词条」：左边发音、右边词 + 释义，音标/词性/出处先收起来，不用横向滑 */
  .eng-tw{overflow:visible}
  table.eng-t{display:block;min-width:0}
  table.eng-t colgroup,table.eng-t thead{display:none}
  table.eng-t tbody{display:block}
  table.eng-t tr{display:grid;grid-template-columns:40px 1fr;column-gap:9px;align-items:baseline;
    padding:9px 2px;border-bottom:1px solid var(--border)}
  table.eng-t tr:hover td{background:none}
  table.eng-t td{display:block;border:0;padding:0}
  table.eng-t td:nth-child(1){grid-column:1;grid-row:1 / span 2}
  table.eng-t td:nth-child(2){grid-column:2;font-size:15.5px}
  table.eng-t td:nth-child(3),table.eng-t td:nth-child(4),table.eng-t td:nth-child(6){display:none}
  table.eng-t td:nth-child(5){grid-column:2;font-size:13px;color:var(--muted);line-height:1.5}
}

<script>
(function(){
  var raw=null;try{raw=window.localStorage;}catch(e){}
  var mem={};
  window.WBS={
    get:function(k){
      if(k in mem)return mem[k];
      try{var v=raw?raw.getItem(k):null;if(v!==null){mem[k]=v;}return v;}catch(e){return null;}
    },
    set:function(k,v){v=String(v);mem[k]=v;try{if(raw)raw.setItem(k,v);}catch(e){}}
  };
  function apply(t){
    var d=t==='dark';
    if(window.wbSetTheme)window.wbSetTheme(t);
    document.documentElement.setAttribute('data-theme',t);
    document.documentElement.classList.toggle('wb-dark',d);
    document.documentElement.classList.toggle('wb-light',!d);
    var b=document.getElementById('theme-btn');
    if(b)b.textContent=d?'\u2600\ufe0f':'\ud83c\udf19';
  }
  window.WBS.applyTheme=apply;
  var t=window.WBS.get('wb_theme');
  if(!t)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  apply(t);
  document.addEventListener('DOMContentLoaded',function(){
    apply(window.WBS.get('wb_theme')||t);
    var b=document.getElementById('theme-btn');
    if(b)b.addEventListener('click',function(){
      var cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
      window.WBS.set('wb_theme',cur);apply(cur);
    });
  });
})();
</script>
<style>
/* wb_theme_pin 主题兜底：pandoc 默认样式带 color-scheme:light dark + light-dark()，
   系统深色时会无视 .wb-light，这里把 color-scheme 和画布底色钉死。
   必须用 !important —— pandoc 那段样式在 head 里排在我们后面。 */
html{color-scheme:light !important}
html.wb-dark,html[data-theme="dark"]{color-scheme:dark !important}
html{background-color:var(--wb-bg,var(--bg,#fff)) !important;
     color:var(--wb-text,var(--text,#1c1c1a)) !important}
</style>
<script>
/* wb_theme_early：首屏前定色，并把 color-scheme 钉死（pandoc light-dark 的克星） */
(function(){
  var KEY='wb_theme';
  function read(){
    var t=null;
    try{var r=window.localStorage;t=r?r.getItem(KEY):null;}catch(e){}
    if(!t&&window.WB_STORAGE){try{t=window.WB_STORAGE.getItem(KEY);}catch(e){}}
    if(t!=='dark'&&t!=='light'){
      t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
    }
    return t;
  }
  window.wbTheme=read;
  window.wbSetTheme=function(t){
    t=(t==='dark'||t==='light')?t:read();
    var d=(t==='dark'),e=document.documentElement,b=document.body;
    e.setAttribute('data-theme',t);
    e.classList.toggle('wb-dark',d);e.classList.toggle('wb-light',!d);
    try{e.style.colorScheme=d?'dark':'light';}catch(err){}
    if(b){b.classList.toggle('wb-dark',d);b.classList.toggle('wb-light',!d);}
    return t;
  };
  window.wbSetTheme(read());
})();
</script>

<script>
(function(){
  var D=window.ENGQ||{lessons:[]}, all=[];
  D.lessons.forEach(function(L){
    L.words.forEach(function(w){
      if(!w.cn||!w.w)return;
      w.lid=L.id;w.u=L.u;w.r=L.r;all.push(w);
    });
  });
  var W=window.WBS;
  function wrongMap(){try{return JSON.parse(W.get('wb_eng_wrong')||'{}')||{};}catch(e){return {};}}
  function saveWrong(o){W.set('wb_eng_wrong',JSON.stringify(o));}

  var el=function(id){return document.getElementById(id);};
  var pool=[],idx=0,mode='mc',done=0,ok=0,cur=null,locked=false;
  var au=null;
  function play(src){
    if(!src)return;
    if(!au){au=new Audio();au.preload='auto';}
    if(au.getAttribute('data-src')!==src){au.setAttribute('data-src',src);au.src=src;au.play();return;}
    try{au.currentTime=0;}catch(e){}
    au.play();
  }
  function shuffle(a){
    a=a.slice();
    for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
    return a;
  }
  function scopeLid(){return el('scope').value;}
  function scopeWords(){
    var v=scopeLid();
    if(v==='wrong'){var wm=wrongMap();return all.filter(function(w){return wm[w.w.toLowerCase()];});}
    if(v==='all')return all.slice();
    return all.filter(function(w){return w.lid===v;});
  }
  function start(){
    pool=shuffle(scopeWords());idx=0;done=0;ok=0;
    if(!pool.length){renderEmpty();return;}
    next();
  }
  function renderEmpty(){
    el('card').innerHTML='<div class="qz-empty">这个范围里还没有词。先做几组题，错的会自动进错词本。</div>';
    stat();
  }
  function stat(){
    var pct=done?Math.round(ok*100/done):0;
    el('stat').innerHTML='<span>已做 '+done+' 题</span><span>正确 '+ok+'</span>'+
      '<span>正确率 '+pct+'%</span><span>本轮进度 '+(pool.length?Math.min(idx+1,pool.length):0)+' / '+pool.length+'</span>';
  }
  function next(){
    locked=false;
    if(idx>=pool.length){finish();return;}
    cur=pool[idx];
    el('fb').innerHTML='';
    var head='<div class="qz-top"><span>Unit '+cur.u+' · Reading '+cur.r+'</span>'+
             '<span>'+(idx+1)+' / '+pool.length+'</span></div>';
    var cnEsc=(cur.cn||'').replace(/</g,'&lt;');
    if(mode==='mc'){
      var opts=[cur],used={};used[cur.w.toLowerCase()]=1;
      var src=all.filter(function(w){return w.lid===cur.lid&&!used[w.w.toLowerCase()];});
      if(src.length<3)src=all.filter(function(w){return !used[w.w.toLowerCase()];});
      var s2=shuffle(src);
      for(var i=0;i<s2.length&&opts.length<4;i++){opts.push(s2[i]);used[s2[i].w.toLowerCase()]=1;}
      opts=shuffle(opts);
      var html=head+'<div class="qz-prompt">'+cnEsc+'</div>'+
        '<div class="qz-sub"><span>'+(cur.pos||'')+'</span>'+
        '<button id="qp">▶ 听发音</button></div><div class="qz-opts">';
      opts.forEach(function(o){
        html+='<button data-w="'+o.w.replace(/"/g,'&quot;')+'">'+o.w.replace(/</g,'&lt;')+'</button>';
      });
      html+='</div>';
      el('card').innerHTML=html;
      el('qp').onclick=function(){play(cur.c);};
      Array.prototype.forEach.call(document.querySelectorAll('.qz-opts button'),function(b){
        b.onclick=function(){answer(b.getAttribute('data-w'),b);};
      });
    }else{
      el('card').innerHTML=head+'<div class="qz-prompt small">'+cnEsc+'</div>'+
        '<div class="qz-sub"><span class="ipa">'+(cur.ipa||'')+'</span>'+
        '<button id="qp">▶ 听发音</button>'+
        '<button id="qh">给个首字母</button></div>'+
        '<div class="qz-input"><input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="拼出这个单词，回车提交">'+
        '<button id="sub">提交</button></div>';
      el('qp').onclick=function(){play(cur.c);};
      el('qh').onclick=function(){
        var w=cur.w;
        el('ans').value=(w[0]||'')+'·'.repeat(Math.max(0,w.length-1));
      };
      el('sub').onclick=function(){submit();};
      el('ans').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
      el('ans').focus();
    }
    stat();
  }
  function normSpell(t){
    return (t||'').toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim();
  }
  function lose(){
    var wm=wrongMap(),k=cur.w.toLowerCase();
    wm[k]=wm[k]||{w:cur.w,cn:cur.cn,lid:cur.lid,n:0};
    wm[k].n+=1;wm[k].t=new Date().toISOString().slice(0,10);
    saveWrong(wm);
  }
  function record(good){
    done++;if(good)ok++;
    if(!good)lose();
  }
  function submit(){
    if(locked)return;
    var v=el('ans').value;
    var good=normSpell(v)===normSpell(cur.w)||
             normSpell(v).replace(/-/g,'')===normSpell(cur.w).replace(/-/g,'');
    locked=true;record(good);
    el('fb').innerHTML=(good?'<span class="ok">✓ 正确</span>':'<span class="no">✗ 写错了</span>')+
      '　正确答案：<code>'+cur.w.replace(/</g,'&lt;')+'</code>'+(cur.ipa?' <span class="ipa">'+cur.ipa+'</span>':'')+
      '<div style="color:var(--muted);font-size:13px;margin-top:4px">'+cur.cn+'</div>'+
      '<div class="qz-next"><button id="nx">下一题 →</button></div>';
    play(cur.c);
    el('nx').onclick=function(){idx++;next();};
    el('ans').disabled=true;
    stat();
  }
  function answer(pick,btn){
    if(locked)return;
    locked=true;
    var good=pick.toLowerCase()===cur.w.toLowerCase();
    record(good);
    Array.prototype.forEach.call(document.querySelectorAll('.qz-opts button'),function(b){
      b.disabled=true;
      if(b.getAttribute('data-w').toLowerCase()===cur.w.toLowerCase())b.classList.add('right');
      else if(b===btn)b.classList.add('wrong');
    });
    el('fb').innerHTML=(good?'<span class="ok">✓ 正确</span>':'<span class="no">✗ 选错了</span>')+
      (good?'':'　正确答案：<code>'+cur.w.replace(/</g,'&lt;')+'</code>')+
      '<div style="color:var(--muted);font-size:13px;margin-top:4px">'+cur.cn+'</div>';
    play(cur.c);
    stat();
    if(good)setTimeout(function(){idx++;next();},900);
    else{
      el('fb').innerHTML+='<div class="qz-next"><button id="nx">下一题 →</button></div>';
      el('nx').onclick=function(){idx++;next();};
    }
  }
  function finish(){
    var pct=done?Math.round(ok*100/done):0;
    el('card').innerHTML='<div class="qz-prompt">这一轮做完了</div>'+
      '<div class="qz-sub">共 '+done+' 题，正确 '+ok+'，正确率 '+pct+'%。'+
      '错的已经进错词本。</div><div class="qz-input"><button id="again">再来一轮</button>'+
      '<button class="ghost" id="only-wrong">只练错词</button></div>';
    el('again').onclick=start;
    el('only-wrong').onclick=function(){el('scope').value='wrong';start();};
    stat();renderWrong();
  }
  function renderWrong(){
    var wm=wrongMap(),keys=Object.keys(wm);
    var box=el('wbody');
    if(!keys.length){box.innerHTML='<div class="qz-empty">错词本是空的。</div>';return;}
    keys.sort(function(a,b){return wm[b].n-wm[a].n;});
    var h='<table class="qz-t"><thead><tr><th>词</th><th>释义</th><th>错次</th><th>出处</th><th></th></tr></thead><tbody>';
    keys.forEach(function(k){
      var it=wm[k],o=null;
      for(var i=0;i<all.length;i++){if(all[i].w.toLowerCase()===k){o=all[i];break;}}
      h+='<tr><td><b>'+it.w+'</b></td><td style="color:var(--muted)">'+(it.cn||'')+'</td>'+
         '<td class="n">'+it.n+'</td><td style="color:var(--muted)">'+(it.lid||'')+'</td>'+
         '<td><button data-p="'+(o?o.c:'')+'">▶</button> <button data-del="'+k+'">移除</button></td></tr>';
    });
    box.innerHTML=h+'</tbody></table>';
    Array.prototype.forEach.call(box.querySelectorAll('button[data-p]'),function(b){
      b.onclick=function(){play(b.getAttribute('data-p'));};
    });
    Array.prototype.forEach.call(box.querySelectorAll('button[data-del]'),function(b){
      b.onclick=function(){
        var wm2=wrongMap();delete wm2[b.getAttribute('data-del')];saveWrong(wm2);renderWrong();
      };
    });
  }

  /* ---- 交互装配 ---- */
  el('scope').onchange=start;
  el('modes').addEventListener('click',function(ev){
    var b=ev.target.closest('button');if(!b)return;
    mode=b.getAttribute('data-m');
    Array.prototype.forEach.call(el('modes').children,function(x){x.classList.toggle('on',x===b);});
    start();
  });
  el('tabs').addEventListener('click',function(ev){
    var b=ev.target.closest('button');if(!b)return;
    var v=b.getAttribute('data-v');
    Array.prototype.forEach.call(el('tabs').children,function(x){x.classList.toggle('on',x===b);});
    el('v-drill').hidden=(v!=='drill');
    el('v-wrong').hidden=(v!=='wrong');
    if(v==='wrong')renderWrong();
  });
  document.addEventListener('keydown',function(ev){
    // 输入框里的回车已经用来提交答案，这里不能把它再当成「下一题」
    if(ev.key!=='Enter'||el('v-drill').hidden)return;
    if(ev.target&&ev.target.id==='ans')return;
    var nx=el('nx');if(nx){nx.click();}
  });

  /* 深链：english-quiz.html?u=1&r=2 */
  var m=location.search.match(/[?&]u=(\d)&r=(\d)/);
  if(m){var lid='u'+m[1]+'r'+m[2];
    if(all.some(function(w){return w.lid===lid;}))el('scope').value=lid;}
  if(/[?&]m=sp/.test(location.search)){
    mode='sp';
    Array.prototype.forEach.call(el('modes').children,function(x){
      x.classList.toggle('on',x.getAttribute('data-m')==='sp');
    });
  }
  if(location.hash==='#wrong'){
    el('tabs').children[0].classList.remove('on');
    el('tabs').children[1].classList.add('on');
    el('v-drill').hidden=true;el('v-wrong').hidden=false;
  }
  start();renderWrong();
})();
</script>
</main>
</body>
</html>
